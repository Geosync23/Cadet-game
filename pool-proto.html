<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pool Prototype</title>
<!--
  Lengths: the pool mini-game prototype for Starship Cadet. A standalone test page, NOT part of the game file.
  Follows plans/rec-minigames-plan.html ("Pool", Lengths): swim four lengths in rhythm. A ring closes in on your
  swimmer; tap as it meets the beat for a clean stroke (mistimed: a splash and a slower stroke). Every few strokes the
  ring turns blue: hold your thumb down through it to breathe. At the wall, swipe up for a tumble turn. No failing,
  no times on screen: bests said in words. Crew swim the other lanes at their own pace; "Race me?" makes it a race;
  Dawn swim is keeping with Rina. Front crawl once your rhythm is smooth (a menu switch here).
  The rules (section 5) are pure: plNew, plStep, plPaper, plClone; fixed 60 steps a second, one seeded stream per go
  kept as plain state (g.rs), no Math.random, no DOM. The game's pool (KIT.recPool): the basin x .8-8.2, z .9-4.5
  room-local, four lanes between ropes at z 1.8, 2.7, 3.6, water at .35, swum chest to chest over 6 m (x 1.5-7.5).
  Every colour through col(); no coplanar surfaces. Test hooks: window.PL. ?seed=N, ?debug.
-->
<style>
  :root { --cy: #50e6ff; --co: #ff7a5c; --ink: #e8f2f5; --dim: #9fb2b8; --panel: rgba(8, 12, 20, .9); --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; background: #05070d; color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  .hide { display: none !important; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.go { background: #0f3440; border-color: var(--cy); color: #dffaff; font-weight: 600; }
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: calc(env(safe-area-inset-top) + 8px) 12px 0; pointer-events: none; }
  .pill { background: rgba(5,8,14,.7); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-weight: 600; font-size: 14px; }
  .pz { background: rgba(5,8,14,.62); border: 1px solid rgba(80,230,255,.35); border-radius: 10px; padding: 3px 10px; font-size: 12px; color: #bfefff; }
  #leave { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); font-size: 13px; padding: 6px 14px; background: rgba(5,8,14,.6); }
  #call { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 26px; font-weight: 700; text-shadow: 0 0 12px rgba(0,0,0,.9); pointer-events: none; }
  #ring, #target { position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); box-sizing: border-box; }
  #target { width: 64px; height: 64px; border: 3px solid rgba(255,255,255,.75); }
  #ring { border: 4px solid #ffffff; }
  #ring.breath { border-color: #50b8ff; } #target.breath { border-color: rgba(80,184,255,.9); background: rgba(80,184,255,.15); }
  #judge { position: fixed; transform: translate(-50%, -100%); font-weight: 700; font-size: 18px; text-shadow: 0 0 8px #000, 0 0 2px #000; pointer-events: none; }
  #turn { position: fixed; left: 0; right: 0; top: 27%; text-align: center; font-size: 20px; font-weight: 700; color: #ffe08a; text-shadow: 0 0 10px #000; pointer-events: none; }
  #turn .arrow { display: block; font-size: 34px; animation: up .8s ease-in-out infinite; }
  @keyframes up { 50% { transform: translateY(-10px); } }
  #air { position: fixed; width: 150px; transform: translate(-50%, 0); pointer-events: none; text-align: center; }
  #air .bar { height: 10px; border-radius: 8px; background: rgba(5,8,14,.75); border: 1px solid rgba(255,255,255,.35); overflow: hidden; }
  #air .fill { height: 100%; width: 100%; border-radius: 8px; background: #50b8ff; }
  #air .lab { font-size: 11px; font-weight: 600; color: #e8f2f5; text-shadow: 0 0 6px #000; margin-top: 2px; }
  .tag { position: fixed; transform: translate(-50%, -100%); font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: rgba(5,8,14,.55); pointer-events: none; white-space: nowrap; }
  .say { position: fixed; transform: translate(-50%, -100%); font-size: 13px; padding: 4px 9px; border-radius: 10px; background: #f3efe4; color: #1b1f24; pointer-events: none; white-space: nowrap; }
  #how { position: fixed; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 74px); display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--cy); border-radius: 14px; padding: 9px 10px 9px 14px; pointer-events: none; max-width: 520px; margin: 0 auto; }
  #how .t { flex: 1; } #how .n { color: var(--cy); font-size: 12px; display: block; } #how button { pointer-events: auto; padding: 6px 12px; font-size: 13px; }
  .over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: 100%; max-width: 440px; box-sizing: border-box; margin: auto; }
  h1 { margin: 0 0 2px; font-size: 30px; letter-spacing: .06em; background: linear-gradient(90deg, var(--cy), #fff 50%, #50b8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode { text-align: left; border-radius: 12px; padding: 9px 10px; }
  .mode b { display: block; } .mode small { color: var(--dim); display: block; font-size: 12px; margin-top: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--dim); }
  .row label { display: flex; gap: 6px; align-items: center; }
  .row input[type=number] { width: 64px; background: #0b111b; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font: inherit; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: var(--ink); }
  .res h2 { font-size: 23px; margin: 0 0 6px; }
  .res p { margin: 4px 0; color: var(--dim); font-size: 14px; }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  #dbg { position: fixed; left: 8px; bottom: 6px; font: 11px monospace; color: #6f8a92; pointer-events: none; }
</style>
</head>
<body>
<div id="hud" class="hide"><div class="pill" id="status"></div><div class="pz">⏸ The ship's clock is paused while you swim</div></div>
<div id="target" class="hide"></div><div id="ring" class="hide"></div><div id="judge" class="hide"></div>
<div id="turn" class="hide"><span class="arrow">⬆</span>Swipe up to turn</div>
<div id="call" class="hide"></div>
<div id="air" class="hide"><div class="bar"><div class="fill"></div></div><div class="lab">Air</div></div>
<button id="leave" class="hide">Leave</button>
<div id="how" class="hide"><div class="t"><span class="n"></span><span class="x"></span></div><button id="howNext">Next</button><button id="howSkip">Skip</button></div>

<div id="menu" class="over">
  <div class="card">
    <h1>LENGTHS</h1>
    <div class="sub">The pool, CSV Wren. A prototype to feel the swimming game: four lengths in rhythm, under the hull windows.</div>
    <div class="modes">
      <button class="mode" data-m="alone"><b>Swim</b><small>Four lengths, just you.</small></button>
      <button class="mode" data-m="crew"><b>Swim with crew</b><small>Three in the other lanes, at their own pace.</small></button>
      <button class="mode" data-m="race"><b>Race me?</b><small>The same three, racing you.</small></button>
      <button class="mode" data-m="dawn"><b>Dawn swim</b><small>Keep with Rina in the next lane.</small></button>
    </div>
    <h2>Your progress (prototype only)</h2>
    <div class="row" style="margin-top:0"><label><input type="checkbox" id="crawl"> Front crawl <small>(once your rhythm's smooth; breaststroke before)</small></label></div>
    <div class="row">
      <label><input type="checkbox" id="howOn" checked> How to play</label>
      <label><input type="checkbox" id="rm"> Reduced motion</label>
      <label><input type="checkbox" id="snd" checked> Sound</label>
      <label>Seed <input type="number" id="seed" value="1" min="1"></label>
    </div>
    <div class="row" id="rec"></div>
  </div>
</div>

<div id="result" class="over hide">
  <div class="card res">
    <h2 id="resT"></h2>
    <div id="resS"></div>
    <div class="btns"><button class="go" id="again">Again</button><button id="done">Done</button></div>
  </div>
</div>
<div id="dbg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// =====================================================================
// 1. SETUP (the game's conventions: sRGB colours through col(), 1 unit = 1 tile)
// =====================================================================
const col = h => new THREE.Color(h).convertSRGBToLinear();
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = col('#05070d');
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 120);
scene.add(new THREE.HemisphereLight(col('#d6eef4'), col('#2a2620'), .9));
const sun = new THREE.DirectionalLight(col('#ffffff'), .55); sun.position.set(-3, 9, 5); scene.add(sun);

// The pool, room-local as in the game (KIT.recPool): a raised basin x .8-8.2, z .9-4.5, its rim .42 high and .22
// thick, water at .35, four lanes between ropes at z 1.8, 2.7, 3.6. A length is swum chest to chest over 6 m.
const POOL = { x0: .8, x1: 8.2, z0: .9, z1: 4.5, H: .42, t: .22, wy: .35 };
const ROPES = [1.8, 2.7, 3.6];
const LANES = [(POOL.z0 + POOL.t + 1.8) / 2, 2.25, 3.15, (3.6 + POOL.z1 - POOL.t) / 2];
const LX0 = 1.5, LEN = 6;                     // the chest's run: x 1.5 to 7.5
const ROOM = { w: 9, d: 7, h: 3.64 };

function partsToGeo(parts) {
  const P = [], N = [], C = [];
  for (const p of parts) {
    const g = (p.g.index ? p.g.toNonIndexed() : p.g.clone()).applyMatrix4(p.m);
    const c = col(p.c), pa = g.attributes.position.array, na = g.attributes.normal.array;
    for (let i = 0; i < pa.length; i += 3) { P.push(pa[i], pa[i + 1], pa[i + 2]); N.push(na[i], na[i + 1], na[i + 2]); C.push(c.r, c.g, c.b); }
    g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  geo.computeBoundingSphere();
  return geo;
}
const M4 = (x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
const BOX = new THREE.BoxGeometry(1, 1, 1);
const cyl = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
const SPH = new THREE.SphereGeometry(1, 16, 10);
const LAMB = new THREE.MeshLambertMaterial({ vertexColors: true });
const GLOWV = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false });
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = (a, b, c) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };

// =====================================================================
// 2. THE POOL ROOM (one merged lit mesh, one glow mesh, the mosaic, the water, the ropes, the stars)
// =====================================================================
const roomParts = [], glowParts = [];
const rbox = (c, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) => roomParts.push({ g: BOX, c, m: M4(x, y, z, sx, sy, sz, rx, ry, rz) });
const gbox = (c, x, y, z, sx, sy, sz) => glowParts.push({ g: BOX, c, m: M4(x, y, z, sx, sy, sz) });
(function room() {
  const P = POOL, cx = (P.x0 + P.x1) / 2, cz = (P.z0 + P.z1) / 2, L = P.x1 - P.x0, W = P.z1 - P.z0;
  rbox('#c9d6d4', ROOM.w / 2, -.05, ROOM.d / 2, ROOM.w + .4, .1, ROOM.d + .4);                          // the tiled deck
  for (const z of [P.z0 + P.t / 2, P.z1 - P.t / 2]) rbox('#d8e6e4', cx, P.H / 2, z, L, P.H, P.t);          // the rim
  for (const x of [P.x0 + P.t / 2, P.x1 - P.t / 2]) rbox('#d8e6e4', x, P.H / 2, cz, P.t, P.H, W - 2 * P.t);
  for (const z of [P.z0 - .02, P.z1 + .02]) rbox('#f2f0ea', cx, P.H + .025, z + (z < cz ? .05 : -.05), L + .08, .05, .1);   // the coping
  for (const x of [P.x0 - .02, P.x1 + .02]) rbox('#f2f0ea', x + (x < cx ? .05 : -.05), P.H + .025, cz, .1, .05, W);
  for (let k = 0; k < 3; k++) rbox('#6fc3c9', P.x0 + P.t + .5, (.3 - k * .1) / 2 + .03, P.z1 - P.t - .15 - k * .3, 1.0, .3 - k * .1, .3);   // the steps
  // the end walls' targets (a dark T on each wall under each lane, just off the rim's face)
  for (const z of LANES) for (const x of [P.x0 + P.t + .006, P.x1 - P.t - .006]) rbox('#1d4c6a', x, .2, z, .01, .22, .05);
  // walls: hull windows along the north (port) side and the bow end, a wall with the changing rooms' door at the stern
  const wy0 = .9, wy1 = 2.9, H = ROOM.h;
  rbox('#2c3a44', ROOM.w / 2, wy0 / 2, -.1, ROOM.w + .2, wy0, .2); rbox('#2c3a44', ROOM.w / 2, (wy1 + H) / 2, -.1, ROOM.w + .2, H - wy1, .2);
  for (const x of [0, 3, 6, 9]) rbox('#33434e', x, (wy0 + wy1) / 2, -.1, .3, wy1 - wy0, .24);
  rbox('#2c3a44', ROOM.w + .1, wy0 / 2, ROOM.d / 2, .2, wy0, ROOM.d); rbox('#2c3a44', ROOM.w + .1, (wy1 + H) / 2, ROOM.d / 2, .2, H - wy1, ROOM.d);
  for (const z of [0, 2.3, 4.6, 7]) rbox('#33434e', ROOM.w + .1, (wy0 + wy1) / 2, z, .24, wy1 - wy0, .3);
  rbox('#b9cfd3', -.1, H / 2, ROOM.d / 2, .2, H, ROOM.d); rbox('#2a3c46', -.02, 1.0, 5.6, .06, 2.0, .9);   // the stern wall: pale tile, the changing rooms' door
  rbox('#2f9fb0', -.005, 1.4, 2.7, .02, .3, 5.0); rbox('#ff7a5c', -.005, 1.62, 2.7, .02, .06, 5.0);   // the rec deck's teal band and coral stripe
  rbox('#5a6578', ROOM.w / 2, .55, 7.0, ROOM.w, .06, .06);                                              // the rail on the lobby's glass
  for (const x of [2.2, 4.4, 6.6]) { rbox('#e8e8e2', x, .3, 5.6, .62, .12, 1.7); rbox('#2f9fb0', x, .4, 5.85, .56, .07, 1.1); }   // loungers
  rbox('#26323d', ROOM.w / 2, H + .05, ROOM.d / 2, ROOM.w + .4, .1, ROOM.d + .4);
  gbox('#50e6ff', ROOM.w / 2, .9, .01, ROOM.w, .04, .04); gbox('#50e6ff', ROOM.w - .01, .9, ROOM.d / 2, .04, .04, ROOM.d);
  for (const z of [1.5, 3.5, 5.5]) gbox('#fff3d6', ROOM.w / 2, H - .02, z, ROOM.w - 1, .02, .12);
  gbox('#dff6ff', .01, 2.6, 2.7, .02, .5, 3.2);                                                         // a lit sign panel over the stern end
})();
scene.add(new THREE.Mesh(partsToGeo(roomParts), LAMB));
scene.add(new THREE.Mesh(partsToGeo(glowParts), GLOWV));
(function stars() {
  const r = mulberry(4242), P = [];
  for (let i = 0; i < 300; i++) P.push(-2 + r() * 13, .9 + r() * 2, -.6 - r() * 6);
  for (let i = 0; i < 300; i++) P.push(ROOM.w + .6 + r() * 6, .9 + r() * 2, -2 + r() * 11);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: col('#dfe8ff'), size: 1.6, sizeAttenuation: false })));
})();
// the basin floor with the Wren in mosaic (the game's recMosaic, drawn once from fixed shapes)
(function floor() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 320; const g = c.getContext('2d'), w = 512, h = 320;
  g.fillStyle = '#8fd3d6'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) { const t = Math.round((hash(x, y, 5) - .5) * 14); g.fillStyle = `rgb(${150 + t},${214 + t},${216 + t})`; g.fillRect(x + 1, y + 1, 14, 14); }
  const fill = (pts, cc) => { g.save(); g.beginPath(); pts.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.clip(); for (let y = 0; y < h; y += 16) for (let x = 0; x < w; x += 16) { g.fillStyle = cc; g.fillRect(x + 1, y + 1, 14, 14); } g.restore(); };
  fill([[90, 120], [330, 104], [420, 140], [440, 160], [420, 180], [330, 216], [90, 200], [70, 160]], '#24507a');
  fill([[110, 104], [180, 70], [210, 104]], '#24507a'); fill([[110, 216], [180, 250], [210, 216]], '#24507a');
  fill([[330, 136], [400, 148], [400, 172], [330, 184]], '#e9c46a'); fill([[60, 140], [76, 140], [76, 180], [60, 180]], '#ff9a3c');
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const P = POOL, side = new THREE.MeshLambertMaterial({ color: col('#6fc3c9') });
  const m = new THREE.Mesh(new THREE.BoxGeometry(P.x1 - P.x0 - 2 * P.t, .03, P.z1 - P.z0 - 2 * P.t), [side, side, new THREE.MeshLambertMaterial({ map: tex }), side, side, side]);
  m.position.set((P.x0 + P.x1) / 2, .015, (P.z0 + P.z1) / 2); scene.add(m);
})();
// the water (the game's recWater, opaque): slow caustics
const WATER = (function () {
  const U = { uT: { value: 0 }, uDeep: { value: col('#1f8fa6') }, uShallow: { value: col('#4fd0dc') } };
  const m = new THREE.ShaderMaterial({ uniforms: U,
    vertexShader: 'varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: `uniform float uT; uniform vec3 uDeep, uShallow; varying vec3 vW;
      void main() {
        vec2 p = vW.xz * 1.6;
        float a = sin(p.x * 1.3 + uT * .8 + sin(p.y * 1.1 + uT * .5)) + sin(p.y * 1.7 - uT * .6 + sin(p.x * .9 - uT * .4));
        float b = sin(p.x * 2.3 - p.y * 1.4 + uT * 1.1) * .5;
        float caus = smoothstep(.35, 0.0, abs(a + b));
        gl_FragColor = vec4(mix(uDeep, uShallow, .5 + .25 * a) + caus * .28, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }` });
  const P = POOL, w = new THREE.Mesh(new THREE.PlaneGeometry(P.x1 - P.x0 - 2 * P.t, P.z1 - P.z0 - 2 * P.t), m);
  w.rotation.x = -Math.PI / 2; w.position.set((P.x0 + P.x1) / 2, P.wy, (P.z0 + P.z1) / 2); scene.add(w);
  return U;
})();
// the lane ropes: floats in runs of orange and white (one instanced mesh)
(function ropes() {
  const P = POOL, L = P.x1 - P.x0 - 2 * P.t, n = 16, s = L / n, im = new THREE.InstancedMesh(cyl(.045, .045, s * .9, 8), new THREE.MeshLambertMaterial(), n * 3), m = new THREE.Matrix4();
  let k = 0;
  for (const z of ROPES) for (let i = 0; i < n; i++) { m.compose(new THREE.Vector3(P.x0 + P.t + s * (i + .5), P.wy, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.PI / 2)), new THREE.Vector3(1, 1, 1)); im.setMatrixAt(k, m); im.setColorAt(k, col(i % 4 < 2 ? '#ff8a3a' : '#f4f4f0')); k++; }
  scene.add(im);
})();
// splashes: white spray puffs above the water (one instanced mesh, a few at a time)
const SPL = 24, splash = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshBasicMaterial({ color: col('#f4fbff'), transparent: true, opacity: .85, toneMapped: false }), SPL);
splash.frustumCulled = false; scene.add(splash);
const SP = Array.from({ length: SPL }, () => ({ x: 0, y: -9, z: 0, vx: 0, vy: 0, vz: 0, t: 1, s: .03 }));
const spR = mulberry(31); let spI = 0;
function spray(x, z, n, big) { if (RM) return; for (let i = 0; i < n; i++) { const p = SP[spI++ % SPL]; p.x = x; p.y = POOL.wy + .05; p.z = z; p.vx = (spR() - .5) * .8; p.vz = (spR() - .5) * .8; p.vy = .6 + spR() * (big ? 1.4 : .7); p.t = 0; p.s = .025 + spR() * (big ? .05 : .03); } }

// =====================================================================
// 3. SWIMMERS (rec kit, a swim cap; the body lies along the lane, back at the water; arms and legs move)
// =====================================================================

const INPUT = { press: 0, down: 0, swipe: 0, thumb: null };
const cv = renderer.domElement;

cv.addEventListener('pointerdown', e => {

cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);

// 10. DRAWING EACH FRAME
// =====================================================================
const tags = [0, 1, 2, 3].map(() => { const e = document.createElement('div'); e.className = 'tag hide'; document.body.appendChild(e); return e; });
const says = [0, 1, 2, 3].map(() => { const e = document.createElement('div'); e.className = 'say hide'; document.body.appendChild(e); return e; });
const V = new THREE.Vector3(), A_ = new THREE.Vector3(), B_ = new THREE.Vector3();
function project(x, y, z) { V.set(x, y, z).project(camera); return V.z > 1 ? null : [(V.x + 1) / 2 * innerWidth, (1 - V.y) / 2 * innerHeight]; }
function toScreen(x, y, z, el) { const p = project(x, y, z); if (!p || p[1] < 120 || p[0] < 0 || p[0] > innerWidth) { el.classList.add('hide'); return; } el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px'; el.classList.remove('hide'); }
// a swimmer's frame: the body flat along the lane, the back just at the water; strokes from its phase
function drawSwimmer(s, f, dtR, tR, i) {

  f.root.rotation.set(0, yaw, 0);

// the ring closing in on your swimmer (screen overlay), the target ring, the judgement, the turn prompt, the air bar

}
{ const o = overview(0); camCur.pos.copy(o.pos); camCur.target.copy(o.target); camCur.fov = o.fov; camFrom.pos.copy(o.pos); camFrom.target.copy(o.target); camFrom.fov = o.fov; }

document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });

// =====================================================================
// 11. TEST HOOKS (Playwright): start goes, run steps fast, read state, paper, clones at other frame rates
// =====================================================================
window.PL = {

  steps: (n, inp) => { if (!G) return null; FAST = true; for (let i = 0; i < n && G.phase !== 'over'; i++) { if (inp) Object.assign(G.inp, inp); plStep(G); } drainEvents(); FAST = false; return PL.state(); },
  // step until your next beat is t seconds away (or it's a breath beat / you're near the wall: what = 'any')
  toBeat: (t = 0) => { if (!G) return null; FAST = true; let n = 0; const s = G.s[0]; while (G.phase !== 'over' && n++ < 600 && (G.phase !== 'go' || s.phase !== 'swim' || s.next - G.t > t + 1e-9)) plStep(G); drainEvents(); FAST = false; return PL.state(); },
  // n steps with whatever the thumb is doing (the test pauses the frame loop, then steps exactly with real touches)
