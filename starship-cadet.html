<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Starship Cadet: CSV Wren</title>
<style>
:root{--ink:#e8eef0;--muted:#93a6ae;--teal:#4cc3b5;--glass:rgba(13,21,33,.72);--line:rgba(150,200,196,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#121a27;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 48%,#2a3750 0%,#151d2c 58%,#0c111b 100%);transition:opacity 1.4s}
body.night #bg{opacity:.4}
canvas{position:fixed;inset:0;display:block;z-index:1}
.hud,.controls,.toast{z-index:2}
.hud{position:fixed;left:14px;top:12px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hud .room{font-size:17px;font-weight:600}
.hud .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.hud .clock{font-size:12.5px;color:#cfe9e4;margin-top:6px;font-variant-numeric:tabular-nums}
.controls{position:fixed;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
button{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,10px);width:min(440px,calc(100% - 24px));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 16px;opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-size:14.5px;margin-bottom:3px;color:#bdeee6;font-weight:600}
.toast span{font-size:13.5px;color:#cfd9dc;line-height:1.45}
@media (prefers-reduced-motion:reduce){.toast,#bg{transition:none}}
.lift{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(340px,calc(100% - 28px));background:rgba(13,21,33,.9);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.lift[hidden]{display:none}
.lift h2{margin:0 2px 2px;font-size:15.5px;font-weight:600;color:#bdeee6}
.lift p{margin:0 2px 10px;font-size:12.5px;color:var(--muted)}
.lift .decks{display:flex;flex-direction:column;gap:6px}
.lift .deckbtn{width:100%;border-radius:12px;padding:9px 10px;justify-content:flex-start;text-align:left;gap:10px}
.lift .deckbtn i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;background:#26343a;color:#e8c06a;border:1px solid rgba(232,192,106,.45)}
.lift .deckbtn b{display:block;font-size:14px;font-weight:600}
.lift .deckbtn small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.lift .deckbtn:disabled{opacity:.42;cursor:default}
.lift .deckbtn.here{opacity:1;border-color:var(--teal)}
.lift .deckbtn.here i{background:#2a9d8f;color:#08201d;border-color:#2a9d8f}
.lift .stay{margin:10px auto 0;padding:7px 16px}
#fade{position:fixed;inset:0;background:#05080d;opacity:0;pointer-events:none;z-index:4}
</style>
</head>
<body>
<div id="bg"></div>
<div class="hud">
  <div class="room" id="room">Bunk 1</div>
  <div class="sub" id="deck">Deck 4, CSV Wren</div>
  <div class="clock" id="clock">Day 1, Monday 06:00</div>
</div>
<div class="controls">
  <button id="rot" aria-label="Rotate view"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>Rotate</button>
  <button id="shad" aria-pressed="true" aria-label="Turn shadows off"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><path d="M13 19c3 0 7-1 8-3"/></svg><span>Shadows</span></button>
  <button id="walls" aria-label="Walls: auto. Tap for all walls down"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 20v-6h5v6"/><path d="M14 20V8h5v12"/></svg><span>Walls</span></button>
  <button id="crew" aria-pressed="true" aria-label="Show or hide visiting crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.6 3.2-5.5 6-5.5s5.2 1.9 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.4.2 4 1.9 4.5 4.6"/></svg><span>Crew</span></button>
  <button id="light" aria-label="Switch to night lighting"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Night</span></button>
  <button id="newgame" aria-label="New game: tap twice to start again"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg><span>New game</span></button>
</div>
<div class="toast" id="toast"><b id="tt"></b><span id="tx"></span></div>
<div class="lift" id="lift" role="dialog" aria-modal="true" aria-labelledby="liftT" hidden>
  <h2 id="liftT">Main lift</h2><p>Choose a deck. Deck 1 is at the top of the ship.</p>
  <div class="decks" id="liftList"></div>
  <button class="stay" id="liftStay">Stay here</button>
</div>
<div class="lift" id="sleepAsk" role="dialog" aria-labelledby="sleepT" hidden>
  <h2 id="sleepT">Your bunk</h2><p id="sleepX">Sleep until 06:00?</p>
  <div class="decks"><button class="deckbtn" id="sleepYes">Sleep until 06:00</button></div>
  <button class="stay" id="sleepNo">Not yet</button>
</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
/* =====================================================================
   STARSHIP CADET: CSV Wren                            build 0.33.2
   Cozy starship life sim. Single file, three.js r128, no image assets.

   FILE MAP
    1. SETUP            renderer, scene, seeded random
    2. TEXTURES         every texture is drawn in code (canvas)
    3. MATERIALS        shared materials and small mesh helpers
    4. DECK             art kit, deck builder, deck definitions (DECKS)
    5. LIGHTING         lights plus day and night presets
    6. CAMERA           isometric orthographic camera, pixel-snapped
    7. GRID             tile grid and A* pathfinding
    8. CHARACTER KIT    makeCharacter(spec), leg IK, walk animation
    8b. CROWD           crowd.add(spec): many crew in a few draw calls; ?crowd=40 demo
    9. CREW DATA        one line per crew member
   10. WALKERS          movement, yielding, room-based crew brain
   11. INTERACTION/UI   tapping, toasts, buttons
   12. MAIN LOOP
   13. SHIP TIME & SAVE the clock, day and night, saving (sits after 5)
   14. SCHEDULES        planDay, whereIs: where all the crew are (after 13)
   17. MACHINES & JOBS  machines, wear, systems, ship health, effects on people (after 14)

   RULES THAT KEEP IT WORKING ON PHONES
   - Never let two surfaces share a plane. Overlap solids instead, or keep
     faces at least 0.005 apart. Coplanar faces flicker on mobile GPUs.
   - Colours are written as sRGB hex and passed through col().
   - 1 unit = 1 floor tile. Rooms sit on a tile grid; furniture blocks tiles.
   ===================================================================== */
// =====================================================================
// 1. SETUP
// =====================================================================
let W = 0, D = 0, OX = 0, OZ = 0;         // the current deck's size in tiles, and where its tile (0,0) sits in the world (set by buildDeck)
const H = 2.8, T = 0.2;                   // wall height and thickness
const col = h => new THREE.Color(h).convertSRGBToLinear();
const small = Math.min(innerWidth, innerHeight) < 700;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#151d2c');
const maxAniso = renderer.capabilities.getMaxAnisotropy();

let seed = 11;
const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// =====================================================================
// 2. TEXTURES (procedural)
// =====================================================================
function tex(w, h, draw, rx = 1, ry = 1, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = maxAniso;
  t.userData = { g, c };
  return t;
}
function grain(g, w, h, amt) {
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (R() - .5) * amt; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
}

const wallTex = tex(128, 360, (g, w, h) => {
  const u = h / H;
  g.fillStyle = '#b2bcb7'; g.fillRect(0, 0, w, h);
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(255,255,255,.07)'); gr.addColorStop(1, 'rgba(0,0,0,.06)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const wy = h - 0.9 * u;
  g.fillStyle = '#56656f'; g.fillRect(0, wy, w, h - wy);
  for (let y = wy + 14; y < h - 6; y += 16) { g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, y, w, 2); g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(0, y + 2, w, 1); }
  g.fillStyle = '#36434b'; g.fillRect(0, wy - 7, w, 7); g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(0, wy - 7, w, 1.5);
  g.fillStyle = 'rgba(45,55,60,.55)'; g.fillRect(0, 0, 2, wy - 7); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(2, 0, 1, wy - 7);
  const hs = h - 2.0 * u; g.fillStyle = 'rgba(45,55,60,.45)'; g.fillRect(0, hs, w, 2); g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(0, hs + 2, w, 1);
  g.fillStyle = '#8f9b9b'; g.fillRect(0, 0, w, 0.16 * u);
  g.fillStyle = 'rgba(60,70,76,.5)';
  [[10, hs - 10], [w - 10, hs - 10], [10, hs + 12], [w - 10, hs + 12]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); });
  grain(g, w, h, 9);
});

function fabric(base, line, step, diag) {
  return tex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.globalAlpha = .08;
    for (let y = 0; y < h; y += 2) { g.fillStyle = y % 4 ? '#000' : '#fff'; g.fillRect(0, y, w, 1); }
    g.globalAlpha = 1;
    if (line) {
      g.strokeStyle = line; g.lineWidth = 2; g.setLineDash([6, 4]);
      for (let k = -h; k < w + h; k += step) {
        g.beginPath();
        if (diag) { g.moveTo(k, 0); g.lineTo(k + h, h); g.moveTo(k + h, 0); g.lineTo(k, h); }
        else { g.moveTo(0, k); g.lineTo(w, k); }
        g.stroke();
      }
    }
    grain(g, w, h, 16);
  });
}
const blanketTex = fabric('#2d5d72', 'rgba(220,240,240,.28)', 64, true); blanketTex.repeat.set(2, 2);
const creamTex = fabric('#ece4d4', null);
const mustardTex = fabric('#c99642', 'rgba(255,240,200,.25)', 32, false);
const tealFabTex = fabric('#2b8a83', null);
const plumTex = fabric('#56466a', 'rgba(255,255,255,.12)', 40, false);

const woodTex = tex(256, 64, (g, w, h) => {
  g.fillStyle = '#8a5b3d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = `rgba(${R() < .5 ? '60,35,20' : '170,120,80'},${.15 + R() * .25})`; g.lineWidth = .5 + R() * 1.5;
    const y0 = R() * h, a = R() * 4; g.beginPath(); g.moveTo(0, y0);
    for (let x = 0; x <= w; x += 16) g.lineTo(x, y0 + Math.sin(x / 40 + i) * a);
    g.stroke();
  }
  grain(g, w, h, 10);
});

function makeRug([base, a, b, c]) {
  return tex(320, 260, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const band = (i, col, lw) => { g.strokeStyle = col; g.lineWidth = lw; g.strokeRect(i, i, w - 2 * i, h - 2 * i); };
    band(10, a, 8); band(22, b, 2); band(30, c, 3);
    g.save(); g.beginPath(); g.rect(40, 40, w - 80, h - 80); g.clip();
    for (let x = 40; x < w; x += 30) for (let y = 40; y < h; y += 30) {
      g.fillStyle = ((x + y) / 30) % 2 < 1 ? a : c; g.globalAlpha = .82;
      g.beginPath(); g.moveTo(x + 15, y + 4); g.lineTo(x + 26, y + 15); g.lineTo(x + 15, y + 26); g.lineTo(x + 4, y + 15); g.closePath(); g.fill();
      g.globalAlpha = 1; g.fillStyle = base; g.beginPath(); g.moveTo(x + 15, y + 10); g.lineTo(x + 20, y + 15); g.lineTo(x + 15, y + 20); g.lineTo(x + 10, y + 15); g.closePath(); g.fill();
    }
    g.restore();
    g.globalAlpha = .1; for (let y = 0; y < h; y += 2) { g.fillStyle = '#000'; g.fillRect(0, y, w, 1); } g.globalAlpha = 1;
    grain(g, w, h, 22);
  });
}
function makeChartPoster(bg, accent, title) {
  return tex(200, 280, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(255,255,255,${R() * .6})`; g.fillRect(R() * w, R() * 220, 1.5, 1.5); }
    g.strokeStyle = accent; g.lineWidth = 2; g.beginPath();
    for (let k = 0; k < 6; k++) { const x = 25 + k * 30, y = 60 + Math.sin(k * 1.7) * 50 + 60; k ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 1; g.strokeRect(10, 10, w - 20, 220);
    g.fillStyle = '#e8efe9'; g.font = '600 14px system-ui,sans-serif'; g.fillText(title, 16, 254);
  });
}
const glowTex = tex(64, 64, (g, w, h) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
}, 1, 1, false);
const fadeTex = tex(8, 64, (g, w, h) => {
  const r = g.createLinearGradient(0, 0, 0, h); r.addColorStop(0, 'rgba(255,255,255,.9)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
}, 1, 1, false);
const blobTex = tex(64, 64, (g) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64);
}, 1, 1, false);
// nebulaTex and starTex are no longer shown (windows look at the real sky), but drawing them keeps R()'s sequence
const nebulaTex = tex(512, 256, (g, w, h) => {
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#070b1f'); bg.addColorStop(1, '#1b1338');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  [[120, 80, 140, 'rgba(60,170,170,.28)'], [300, 200, 180, 'rgba(160,70,170,.22)'], [420, 60, 120, 'rgba(70,90,200,.25)']].forEach(([x, y, r, c]) => {
    const n = g.createRadialGradient(x, y, 0, x, y, r); n.addColorStop(0, c); n.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = n; g.fillRect(0, 0, w, h);
  });
  const px = 350, py = 165, pr = 62;
  const p = g.createRadialGradient(px - 25, py - 25, 5, px, py, pr);
  p.addColorStop(0, '#f6c47a'); p.addColorStop(.6, '#c7783c'); p.addColorStop(1, '#5a2a1e');
  g.fillStyle = p; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
  g.save(); g.beginPath(); g.arc(px, py, pr, 0, 7); g.clip();
  g.globalAlpha = .25; g.strokeStyle = '#ffe2b0';
  for (let i = -3; i <= 3; i++) { g.lineWidth = 3; g.beginPath(); g.ellipse(px, py + i * 16, pr, 6, 0, 0, 7); g.stroke(); }
  g.globalAlpha = 1;
  const sh = g.createRadialGradient(px + 40, py + 40, 10, px + 30, py + 30, pr * 1.2);
  sh.addColorStop(0, 'rgba(5,5,20,.85)'); sh.addColorStop(1, 'rgba(5,5,20,0)'); g.fillStyle = sh; g.fillRect(0, 0, w, h);
  g.restore();
  g.strokeStyle = 'rgba(255,200,140,.35)'; g.lineWidth = 3; g.beginPath(); g.arc(px, py, pr + 2, Math.PI * .9, Math.PI * 1.6); g.stroke();
}, 1, 1, true);
const starTex = tex(512, 256, (g, w, h) => {
  for (let i = 0; i < 260; i++) {
    const s = R() < .08 ? 1.6 : .7 + R() * .6;
    g.fillStyle = `rgba(255,255,255,${.35 + R() * .65})`; g.beginPath(); g.arc(R() * w, R() * h, s, 0, 7); g.fill();
  }
}, 1, 1, true);

const posterTex = tex(200, 280, (g, w, h) => {
  g.fillStyle = '#16223d'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${R() * .7})`; g.fillRect(R() * w, R() * 220, 1.5, 1.5); }
  const pts = [[30, 190], [62, 150], [95, 160], [120, 110], [150, 120], [172, 60]];
  g.strokeStyle = '#59d4c4'; g.lineWidth = 2; g.setLineDash([5, 4]); g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.setLineDash([]);
  pts.forEach(([x, y], i) => { g.fillStyle = i === pts.length - 1 ? '#f2b45e' : '#cfeeea'; g.beginPath(); g.arc(x, y, i === pts.length - 1 ? 6 : 3.5, 0, 7); g.fill(); });
  g.strokeStyle = 'rgba(207,238,234,.25)'; g.lineWidth = 1; g.strokeRect(10, 10, w - 20, 220);
  g.fillStyle = '#e8efe9'; g.font = '600 15px system-ui,sans-serif'; g.fillText('Wren survey route', 16, 254);
  g.fillStyle = '#8aa3b0'; g.font = '11px system-ui,sans-serif'; g.fillText('Frontier tour, year one', 16, 270);
});

const lockerTex = tex(140, 210, (g, w, h) => {
  g.fillStyle = '#4b5861'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(w / 2 - 1, 6, 2, h - 12);
  g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 2; g.strokeRect(5, 5, w - 10, h - 10);
  g.fillStyle = '#2a9d8f'; g.fillRect(5, 22, w - 10, 6);
  g.fillStyle = '#c9d2d2'; g.fillRect(w / 2 - 12, h * .48, 4, 22); g.fillRect(w / 2 + 8, h * .48, 4, 22);
  for (let i = 0; i < 5; i++) { g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(14, 40 + i * 6, 40, 2); g.fillRect(w - 54, 40 + i * 6, 40, 2); }
  grain(g, w, h, 10);
});
const doorTex = tex(120, 220, (g, w, h) => {
  g.fillStyle = '#4f5d66'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(w / 2 - 1.5, 0, 3, h);
  g.fillStyle = '#5fd6c6'; g.fillRect(w / 2 - 22, h * .45, 4, 36); g.fillRect(w / 2 + 18, h * .45, 4, 36);
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2; g.strokeRect(8, 8, w / 2 - 14, h - 16); g.strokeRect(w / 2 + 6, 8, w / 2 - 14, h - 16);
  grain(g, w, h, 8);
});

const screenTex = tex(256, 160, () => {}, 1, 1, true);
function drawScreen(t) {
  const { g } = screenTex.userData, w = 256, h = 160;
  g.fillStyle = '#0b2629'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#134347'; g.fillRect(0, 0, w, 24);
  g.fillStyle = '#c5f4ec'; g.font = '600 13px system-ui,sans-serif'; g.fillText('Duty board', 10, 16);
  g.fillStyle = '#6fb8ae'; g.font = '11px system-ui,sans-serif'; g.fillText('Day shift', 190, 16);
  const rows = ['Service galley oven', 'Replace corridor lamp', 'Restock scrubber filters'];
  rows.forEach((r, i) => {
    const y = 42 + i * 22;

// ---- placing things ----
const FACING = { n: 0, w: Math.PI / 2, e: -Math.PI / 2, s: Math.PI };   // which wall the back of a piece is against
// place a floor piece in room-local units (0,0 = room's top-left corner)
function place(roomKey, kind, lx, lz, back = 'n', o = {}) {
  const b = ROOM_BOX[roomKey], g = new THREE.Group();
  g.position.set(X0(b.i0) + lx, 0, Z0(b.j0) + lz); g.rotation.y = (FACING[back] || 0) + (o.turn || 0); staticRoot.add(g);
  const fp = KIT[kind](g, o);
  if (fp.tall && !NO_FADE.has(roomKey)) {
    const fk = o.fadeGroup || roomKey;                   // a room fades as one, unless pieces name their own group (storage aisles)
    let t = TALL_BY_ROOM[fk];
    if (!t) { t = TALL_BY_ROOM[fk] = { g: new THREE.Group(), pts: [], o: 1 }; deckRoot.add(t.g); TALL.push(t); }
    staticRoot.remove(g); t.g.add(g); t.pts.push({ x: g.position.x, z: g.position.z, w: Math.max(fp.w, fp.d) });
  }
  // block the tiles under the footprint
  const sw = (back === 'w' || back === 'e') ? fp.d : fp.w, sd = (back === 'w' || back === 'e') ? fp.w : fp.d;
  if (!fp.noBlock && !o.noBlock) {
    const box = o.snug && [g.position.x - sw / 2, g.position.x + sw / 2, g.position.z - sd / 2, g.position.z + sd / 2];
    for (let j = 0; j < D; j++) for (let i = 0; i < W; i++) {
      const cx = X0(i) + .5, cz = Z0(j) + .5;
      if (Math.abs(cx - g.position.x) <= sw / 2 + .08 && Math.abs(cz - g.position.z) <= sd / 2 + .08) {
        BLOCKED.add(i + ',' + j);
        if (box) { const k = i + ',' + j; SNUG.set(k, (SNUG.get(k) || []).concat([box])); }
      }
    }
  }
  for (const k of (o.block || [])) BLOCKED.add((b.i0 + k[0]) + ',' + (b.j0 + k[1]));
  if (o.it) {
    const hit = new THREE.Mesh(new THREE.BoxGeometry(fp.w, o.hitH || 1.2, fp.d), HIT_MAT);
    hit.position.y = (o.hitH || 1.2) / 2; hit.userData.noMerge = true; g.add(hit);
    ITEMS.push({ ...o.it, hit, g, front: FACING[back] + (o.turn || 0), depth: fp.d });
  }
  return g;
}
// place a wall piece on the inner face of a wall: room-local position along that wall
function placeWall(roomKey, kind, wall, along, o = {}) {
  const b = ROOM_BOX[roomKey], g = new THREE.Group();
  let x, z, key;
  if (wall === 'n') { x = X0(b.i0) + along; z = Z0(b.j0) + T / 2; key = `h,${b.i0 + Math.floor(along)},${b.j0}`; }
  if (wall === 's') { x = X0(b.i0) + along; z = Z0(b.j1 + 1) - T / 2; key = `h,${b.i0 + Math.floor(along)},${b.j1 + 1}`; }
  if (wall === 'w') { x = X0(b.i0) + T / 2; z = Z0(b.j0) + along; key = `v,${b.i0},${b.j0 + Math.floor(along)}`; }
  if (wall === 'e') { x = X0(b.i1 + 1) - T / 2; z = Z0(b.j0) + along; key = `v,${b.i1 + 1},${b.j0 + Math.floor(along)}`; }
  g.position.set(x, 0, z); g.rotation.y = FACING[wall]; deckRoot.add(g);
  WALL_KIT[kind](g, o);
  const e = EDGES.get(o.edge || key);
  WALL_DECOR.push({ g, e });
  if (o.it) {
    const hit = new THREE.Mesh(new THREE.BoxGeometry(o.hitW || .9, 1.2, .3), HIT_MAT); hit.position.set(0, 1.5, .15); hit.userData.noMerge = true; g.add(hit);
    ITEMS.push({ ...o.it, hit, g, front: FACING[wall], depth: .1, wall: true });
  }
  return g;
}
function placeOnEdge(kind, key, toward, o = {}) {        // a wall piece on an edge, facing the side named by toward
  const e = EDGES.get(key); if (!e) return;
  const [k, a, b] = key.split(','), i = +a, j = +b, g = new THREE.Group();
  if (k === 'h') { g.position.set(X0(i) + .5, 0, Z0(j) + (toward === 's' ? T / 2 : -T / 2)); g.rotation.y = toward === 's' ? 0 : Math.PI; }
  else { g.position.set(X0(i) + (toward === 'e' ? T / 2 : -T / 2), 0, Z0(j) + .5); g.rotation.y = toward === 'e' ? Math.PI / 2 : -Math.PI / 2; }
  deckRoot.add(g); WALL_KIT[kind](g, o); WALL_DECOR.push({ g, e });
  if (o.it) {                                            // tappable, like placeWall's pieces
    const hit = new THREE.Mesh(new THREE.BoxGeometry(o.hitW || .9, 1.2, .3), HIT_MAT); hit.position.set(0, 1.5, .15); hit.userData.noMerge = true; g.add(hit);
    ITEMS.push({ ...o.it, hit, g, front: g.rotation.y, depth: .1, wall: true });
  }
}

// ---- merge everything static into a few meshes ----
function mergeMeshes(root) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert(), m4 = new THREE.Matrix4();
  const buckets = new Map(), done = [];
  root.traverse(o => {
    if (!o.isMesh || o.userData.noMerge) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(m4.multiplyMatrices(inv, o.matrixWorld));
    const groups = Array.isArray(o.material) ? g.groups : [{ start: 0, count: g.attributes.position.count, materialIndex: 0 }];
    const P = g.attributes.position.array, Nn = g.attributes.normal.array, U = g.attributes.uv ? g.attributes.uv.array : null;
    for (const gr of groups) {
      const mat = mats[gr.materialIndex]; if (!mat) continue;
      const key = mat.uuid + (o.userData.noShadow ? '-ns' : '');
      let b = buckets.get(key); if (!b) buckets.set(key, b = { mat, P: [], N: [], U: [], shadow: !o.userData.noShadow });
      for (let v = gr.start; v < gr.start + gr.count; v++) {
        b.P.push(P[v * 3], P[v * 3 + 1], P[v * 3 + 2]); b.N.push(Nn[v * 3], Nn[v * 3 + 1], Nn[v * 3 + 2]);
        if (U) b.U.push(U[v * 2], U[v * 2 + 1]); else b.U.push(0, 0);
      }
    }
    g.dispose(); done.push(o);
  });
  for (const o of done) o.parent.remove(o);
  for (const b of buckets.values()) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(b.P, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.N, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(b.U, 2));
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, b.mat); mesh.castShadow = b.shadow; mesh.receiveShadow = true; root.add(mesh);
  }
}

// 4c. BUILD AND UNLOAD A DECK
// buildDeck(def) makes def the current deck: fills the state in 4a, puts

// unloadDeck() takes the current deck apart again.

function buildDeck(def) {

    for (let x = HULL.bowFrom; x > x0 + r; x -= st) add(x, D);

    for (let z = D - r; z > r; z -= st) add(x0, z);

  }

    const [bx, bz] = HULL_PTS[(k + 1) % HULL_PTS.length], dx = bx - ax, dz = bz - az, l = Math.hypot(dx, dz);
    return { ax, az, bx, bz, dx, dz, l2: l * l, l, nx: -dz / l, nz: dx / l };   // n points into the deck
  });

  STAND = new Set();         // tiles whose centre sits well inside the hull, where people can stand
  for (let j = 0; j < D; j++) for (let i = 0; i < W; i++) if (hullDist(i + .5, j + .5) > .45) STAND.add(i + ',' + j);
  for (const [key, type] of Object.entries(DOORS)) {          // locked rooms say what they are
    if ((type !== 'closed' && type !== 'hatch') || CLOSED_DOORS[key] || !def.lockedRoom || (def.service || []).includes(key)) continue;
    const [k, a, b] = key.split(','), i = +a, j = +b, r = (k === 'h' ? [roomAt(i, j - 1), roomAt(i, j)] : [roomAt(i - 1, j), roomAt(i, j)]).find(r => r && !ROOMS[r].hall);

// 5. LIGHTING
// The sun casts all shadows and follows the camera, snapped to shadow
// texels so edges don't shimmer. Lamps come up at night.
// =====================================================================
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1);
const SUN_OFF = new THREE.Vector3(-2.5, 9, 5.5);
sun.castShadow = true; scene.add(sun); scene.add(sun.target);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 30 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
const sunDir = SUN_OFF.clone().normalize();
const sunR = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), sunDir).normalize();
const sunU = new THREE.Vector3().crossVectors(sunDir, sunR);
function placeSun(p) {
  const ts = 20 / sun.shadow.mapSize.x, v = new THREE.Vector3(p.x, 0, p.z), a = v.dot(sunR), b = v.dot(sunU);
  v.addScaledVector(sunR, Math.round(a / ts) * ts - a).addScaledVector(sunU, Math.round(b / ts) * ts - b);
  sun.target.position.copy(v); sun.position.copy(v).add(SUN_OFF);
}

const DAY = { sky: col('#e3ebf1'), gnd: col('#5b4d41'), hemi: .85, sun: col('#fff2e0'), sunI: 1.6, exp: 1.05, bg: new THREE.Color('#151d2c') };
const NIGHT = { sky: col('#6d7ca3'), gnd: col('#2a1f18'), hemi: .32, sun: col('#ffb371'), sunI: .5, exp: 1.0, bg: new THREE.Color('#0a0e17') };
let nightT = 0;                                          // 0 day ... 1 night; follows the clock (section 13)
function applyLight(k) {
  const lerp = THREE.MathUtils.lerp;
  hemi.color.copy(DAY.sky).lerp(NIGHT.sky, k); hemi.groundColor.copy(DAY.gnd).lerp(NIGHT.gnd, k);
  hemi.intensity = lerp(DAY.hemi, NIGHT.hemi, k);
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, k); sun.intensity = lerp(DAY.sunI, NIGHT.sunI, k);
  const ml = deckDef && deckDef.light;                   // a deck's own mood (Deck 6 runs warm and dim)
  if (ml) { hemi.color.multiply(ml.sky); hemi.intensity *= ml.hemi; sun.color.multiply(ml.sun); sun.intensity *= ml.sunI; }
  for (const L of LAMPS) L.l.intensity = lerp(L.day, L.night, k);
  renderer.toneMappingExposure = lerp(DAY.exp, NIGHT.exp, k);
  scene.background.copy(DAY.bg).lerp(NIGHT.bg, k);
  SKY.mat.uniforms.uK.value = lerp(.8, 1.15, k);
}

// 13. SHIP TIME & SAVE
// Sits here, after lighting and before the first deck is built (section 10):
// the clock drives the light, and the save decides where you wake.
// The ship day lasts 30 real minutes. SHIP.time is the ship's clock: day 1 is
// a Monday, min counts ship minutes since midnight. It only runs while the
// game is on screen; the ship doesn't run while the game is closed.
// The game saves itself in the browser (localStorage, one save per device):
// every ship hour, on every deck change, and when the page is hidden or
// closed. Every read and write is in try/catch: no storage means a fresh
// start each time. URL flags: ?nosave turns saving and loading off (the tests
// use it); ?debug shows the Night/Day button (skip to 21:40, sleep to 07:40).
// Nothing here calls R().
// =====================================================================
const GAME_BUILD = '0.33.2';                             // keep in step with the header's build line
const SHIP_RATE = 1440 / 1800;                           // ship minutes per real second (a 30-minute day)
const SHIP_START = { day: 1, min: 6 * 60, deck: 4 };     // Monday 06:00, in Bunk 1 (the tile is PLAYER_SPEC.start)
SHIP.time = { day: SHIP_START.day, min: SHIP_START.min };
const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const shipNow = () => (SHIP.time.day - 1) * 1440 + SHIP.time.min;    // absolute ship minutes
const weekday = day => ((day - 1) % 7 + 7) % 7;                         // 0 = Monday ... 6 = Sunday
const hhmm = min => { const m = Math.floor(min); return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const clockText = () => 'Day ' + SHIP.time.day + ', ' + WEEKDAYS[weekday(SHIP.time.day)] + ' ' + hhmm(SHIP.time.min);
function setShipNow(abs) { SHIP.time.day = Math.floor(abs / 1440) + 1; SHIP.time.min = abs - (SHIP.time.day - 1) * 1440; }
// how dark the ship is at a time of day, 0 (day) to 1 (night): night from 21:00 to 06:00, with an hour of
// dusk (20:30-21:30) and of dawn (05:30-06:30) centred on them. The light eases toward this (main loop).
function nightAt(min = SHIP.time.min) {
  const s = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  return Math.max(1 - s((min - 330) / 60), s((min - 1230) / 60));
}

// Time jumps. Anything that simulates the ship registers a function here, SIM_ADVANCE.push((from, to) => ...),
// called with absolute ship minutes whenever time skips forward (sleep, the debug skip). It must be fast and draw
// nothing. Nothing is registered yet: the schedules (section 14) will advance everyone's state through it.
const SIM_ADVANCE = [];
function skipTo(abs) {
  const from = shipNow(); if (!(abs > from)) return;
  setShipNow(abs);
  for (const f of SIM_ADVANCE) f(from, abs);
  updateClock(); saveGame();
}
// the player sleeps: time skips to `min` (ship minutes since midnight) the next time it comes round
function sleepUntil(min) {
  const now = shipNow(), today = (SHIP.time.day - 1) * 1440 + min;
  skipTo(today > now ? today : today + 1440);
}
// the clock's frame step (main loop): the HUD clock each ship minute, a save each ship hour
function tickShip(dt) {
  if (document.hidden) return;                           // time never runs while the tab is hidden
  const m = Math.floor(SHIP.time.min), h = Math.floor(shipNow() / 60);
  SHIP.time.min += dt * SHIP_RATE;
  if (SHIP.time.min >= 1440) { SHIP.time.min -= 1440; SHIP.time.day++; }
  if (Math.floor(SHIP.time.min) !== m) updateClock();
  if (Math.floor(shipNow() / 60) !== h) saveGame();
}

// ---- saving: { v, build, time, player: { deck, tile, facing }, ship: { decks: { n: { open } } }, crew: {} } ----
const SAVE_KEY = 'starship-cadet-save', SAVE_V = 1;
const SAVE_EXTRA = [];                                   // other sections add their part: f(save) just before it's written (17: machines)
const URL_FLAGS = new URLSearchParams(location.search);
const NOSAVE = URL_FLAGS.has('nosave') || URL_FLAGS.has('crowd'),   // the crowd demo (section 8b) never touches the save
      DEBUG = URL_FLAGS.has('debug');
function saveGame() {
  if (NOSAVE) return;
  try {
    const decks = {};
    for (const n in SHIP.decks) if (SHIP.decks[n].open.size) decks[n] = { open: [...SHIP.decks[n].open] };
    const save = {
      v: SAVE_V, build: GAME_BUILD, time: { day: SHIP.time.day, min: SHIP.time.min },
      player: { deck: player.deck, tile: player.here(), facing: player.face }, ship: { decks }, crew: {},
    };
    for (const f of SAVE_EXTRA) f(save);
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) { /* no storage, or full: the game carries on unsaved */ }
}
function loadGame() {
  if (NOSAVE) return null;

      if (j <= cj + 1 && innerBlocks(EDGES.get(`v,${i},${j}`), who)) pushOutBox(p, X0(i) - T / 2, X0(i) + T / 2, Z0(j), Z0(j + 1), r);
      const touch = [`h,${i - 1},${j}`, `h,${i},${j}`, `v,${i},${j - 1}`, `v,${i},${j}`].map(k => EDGES.get(k));
      if (touch.some(wallish) && !liftJoint(touch.filter(Boolean))) { const c = (1 - SEG) / 2 + .02; pushOutBox(p, X0(i) - c, X0(i) + c, Z0(j) - c, Z0(j) + c, r); }
    }
    for (const sg of CURVE_SEGS) {                       // curved walls and counters
      if (Math.abs(p.x - sg.ax) > 2 || Math.abs(p.z - sg.az) > 2) continue;

  }
}

// =====================================================================
// 8. CHARACTER KIT
// makeCharacter(spec) builds any crew member from a short description.
// Parts are merged into one vertex-coloured mesh per joint (~17 meshes per
// person, all sharing one material), so a full crew stays cheap to draw.
// Spec fields: dept, rank, skin, hair, hairColor, height, build, acc[]
// =====================================================================
// uniform colours, design v3: command red; works and watch gold; survey and infirmary blue-green
const DEPT = { command: '#b8433a', works: '#d9a441', watch: '#d9a441', survey: '#2f8e98', infirmary: '#2f8e98' };
// departments that share a colour are told apart by the badge: a silver shape with a coloured inlay
const BADGE = {
  command:   { shape: 'diamond', inlay: '#e8c06a' },
  works:     { shape: 'diamond', inlay: '#b5542a' },
  watch:     { shape: 'shield',  inlay: '#2e4a73' },
  survey:    { shape: 'circle',  inlay: '#1d5f73' },
  infirmary: { shape: 'cross',   inlay: '#c8463c' },
};
const DEPT_NAME = { survey: 'Survey', infirmary: 'Infirmary', watch: 'Watch', works: 'Works', command: 'Command' };
const RANK_NAME = ['Junior Officer', 'Officer', 'Department Chief', 'Executive Officer', 'Captain'];
const SKIN = ['#f3cfae', '#e3b08a', '#c98f66', '#a46c4b', '#7d4f35', '#573626'];
const HAIR = { black: '#1d1917', dark: '#3a2820', brown: '#6b4a2f', auburn: '#8c3f22', blonde: '#cfa966', grey: '#9f9a93', white: '#dcd8d0', teal: '#2f7f86' };
const BUILD = { slim: .86, average: 1, broad: 1.18 };
const HAIR_STYLES = ['ponytail', 'short', 'bun', 'curls', 'buzz', 'long', 'bald'];
const ACCESSORIES = ['glasses', 'beard', 'moustache', 'earrings', 'headband', 'apron'];
const LT = .33, LS = .31, ANK = .052, HIP_Y = .70, HIP_W = .655, HIP_OFF = .02;   // leg proportions (local units)

const CHAR_MAT = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .62, metalness: .04 });
const GEO = { sph: new THREE.SphereGeometry(1, 20, 14), box: new THREE.BoxGeometry(1, 1, 1) };
const _geoCache = {};
const cylG = (rt, rb, h, seg = 14) => { const k = `c${rt.toFixed(4)},${rb.toFixed(4)},${h},${seg}`; return _geoCache[k] || (_geoCache[k] = new THREE.CylinderGeometry(rt, rb, h, seg)); };
const capG = (r, th) => { const k = `s${r},${th}`; return _geoCache[k] || (_geoCache[k] = new THREE.SphereGeometry(r, 20, 12, 0, Math.PI * 2, 0, th)); };

// queue a primitive on a joint; bake() merges everything later
function part(pv, geo, color, x, y, z, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) {
  (pv.userData.parts || (pv.userData.parts = [])).push({ geo, c: col(color), m: new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz)) });
}
function bake(root) {
  const joints = []; root.traverse(o => { if (o.userData.parts) joints.push(o); });
  for (const pv of joints) {
    const P = [], N = [], C = [];
    for (const p of pv.userData.parts) {
      const g = (p.geo.index ? p.geo.toNonIndexed() : p.geo.clone()).applyMatrix4(p.m);
      const pa = g.attributes.position.array, na = g.attributes.normal.array;
      for (let i = 0; i < pa.length; i += 3) { P.push(pa[i], pa[i + 1], pa[i + 2]); N.push(na[i], na[i + 1], na[i + 2]); C.push(p.c.r, p.c.g, p.c.b); }

    geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));

function makeCharacter(spec, finish = bake) {          // finish: what to do with the queued parts (the crowd keeps them)
  const s = Object.assign({ dept: 'survey', rank: 0, skin: 2, hair: 'short', hairColor: 'dark', height: 1, build: 'average', acc: [] }, spec);
  const bw = BUILD[s.build] || 1, skin = SKIN[s.skin] || s.skin, hc = HAIR[s.hairColor] || s.hairColor;
  const uni = DEPT[s.dept] || DEPT.survey, uniDk = shade(uni, .66), has = a => s.acc.includes(a);
  const suit = '#27313a', pants = '#3a4653', boot = '#16191d', sole = '#3a3f44', gold = '#e8c06a';
  const root = new THREE.Group(); root.scale.setScalar(s.height);
  const rig = { root, legs: [], arms: [], spec: s };
  const pv = (p, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); p.add(g); return g; };

  // legs
  rig.hips = pv(root, 0, HIP_Y, 0);
  part(rig.hips, GEO.sph, pants, 0, -.01, 0, .155 * bw, .095, .115 * bw);
  for (const side of [1, -1]) {
    const thigh = pv(rig.hips, side * .088 * bw, -HIP_OFF, 0);
    part(thigh, GEO.sph, pants, 0, 0, 0, .07 * bw, .07, .07 * bw);
    part(thigh, cylG(.07 * bw, .058 * bw, LT), pants, 0, -LT / 2, 0);
    const knee = pv(thigh, 0, -LT, 0);
    part(knee, GEO.sph, pants, 0, 0, 0, .06 * bw, .06, .062 * bw);
    part(knee, cylG(.057 * bw, .047 * bw, LS), pants, 0, -LS / 2, 0);
    part(knee, cylG(.056 * bw, .06 * bw, .11), boot, 0, -LS + .06, 0);
    const ankle = pv(knee, 0, -LS, 0);
    part(ankle, GEO.sph, boot, 0, -.008, .04, .062 * bw, .042, .115);
    part(ankle, GEO.box, sole, 0, -.045, .035, .1 * bw, .014, .2);
    rig.legs.push({ thigh, knee, ankle, side, off: side > 0 ? 0 : .5 });
  }
  // torso
  rig.torso = pv(rig.hips, 0, .05, 0);
  part(rig.torso, cylG(.153 * bw, .15 * bw, .1, 20), suit, 0, .03, 0);
  part(rig.torso, cylG(.158 * bw, .158 * bw, .045, 20), boot, 0, 0, 0);
  part(rig.torso, GEO.box, gold, 0, 0, .158 * bw, .06, .04, .02);
  part(rig.torso, GEO.box, boot, -.12 * bw, -.035, .08 * bw, .07, .08, .05, 0, -.5, 0);
  if (has('apron')) part(rig.torso, GEO.box, '#e8e0cf', 0, -.1, .165 * bw, .25 * bw, .22, .02);
  rig.chest = pv(rig.torso, 0, .07, 0);
  part(rig.chest, cylG(.17 * bw, .155 * bw, .25, 20), suit, 0, .125, 0);
  part(rig.chest, cylG(.183 * bw, .172 * bw, .12, 20), uni, 0, .22, 0);
  part(rig.chest, cylG(.175 * bw, .175 * bw, .015, 20), uniDk, 0, .16, 0);
  part(rig.chest, GEO.sph, uni, 0, .28, 0, .2 * bw, .07, .15 * bw);
  if (has('apron')) part(rig.chest, GEO.box, '#e8e0cf', 0, .06, .162 * bw, .2 * bw, .2, .02);
  else {                                               // department badge, left breast
    const bd = BADGE[s.dept] || BADGE.survey, bx = .085 * bw, bz = .168 * bw, silver = '#dfe4e6';
    if (bd.shape === 'diamond') {
      part(rig.chest, GEO.box, silver, bx, .2, bz, .045, .045, .015, 0, 0, Math.PI / 4);
      part(rig.chest, GEO.box, bd.inlay, bx, .2, bz + .006, .024, .024, .012, 0, 0, Math.PI / 4);
    } else if (bd.shape === 'shield') {
      part(rig.chest, GEO.box, silver, bx, .202, bz, .042, .05, .015);
      part(rig.chest, GEO.box, silver, bx, .174, bz, .026, .026, .015, 0, 0, Math.PI / 4);
      part(rig.chest, GEO.box, bd.inlay, bx, .2, bz + .006, .024, .03, .012);
    } else if (bd.shape === 'circle') {
      part(rig.chest, cylG(.027, .027, .015, 16), silver, bx, .2, bz, 1, 1, 1, Math.PI / 2, 0, 0);
      part(rig.chest, cylG(.015, .015, .012, 16), bd.inlay, bx, .2, bz + .006, 1, 1, 1, Math.PI / 2, 0, 0);
    } else {
      part(rig.chest, GEO.box, silver, bx, .2, bz, .052, .018, .015);
      part(rig.chest, GEO.box, silver, bx, .2, bz, .018, .052, .015);
      part(rig.chest, GEO.box, bd.inlay, bx, .2, bz + .006, .012, .012, .012);
    }
  }
  part(rig.chest, cylG(.075, .085, .05, 16), uniDk, 0, .33, 0);
  for (let i = 0; i < Math.min(4, s.rank + 1); i++) { const a = .55 + i * .32; part(rig.chest, GEO.sph, gold, Math.sin(a) * .083, .33, Math.cos(a) * .083, .011, .011, .011); }
  part(rig.chest, cylG(.05, .055, .08, 12), skin, 0, .37, 0);
  // head and face
  const h = rig.head = pv(rig.chest, 0, .4, 0);
  part(h, GEO.sph, skin, 0, .13, 0, .155, .17, .155);
  for (const sd of [1, -1]) {
    part(h, GEO.sph, skin, sd * .152, .12, 0, .025, .04, .03);
    part(h, GEO.sph, '#1b1f23', sd * .055, .145, .14, .022, .03, .012);
    part(h, GEO.box, s.hair === 'bald' ? shade(skin, .6) : hc, sd * .056, .188, .138, .05, .012, .012, 0, 0, sd * -.12);
    if (has('earrings')) part(h, GEO.sph, gold, sd * .158, .085, .005, .014, .014, .014);
  }
  part(h, GEO.sph, skin, 0, .11, .155, .02, .025, .02);
  part(h, GEO.box, shade(skin, .7), 0, .072, has('beard') ? .17 : .146, .04, .008, .01);
  // hair
  const cap = (r, th, y, tilt, sy = 1.05) => part(h, capG(r, th), hc, 0, y, -.01, 1, sy, 1, tilt, 0, 0);
  switch (s.hair) {
    case 'ponytail':
      cap(.168, Math.PI * .52, .14, -.38);
      part(h, GEO.sph, hc, .045, .255, .105, .1, .04, .055, 0, 0, .3);
      rig.tail = pv(h, 0, .2, -.13);
      part(rig.tail, GEO.sph, hc, 0, -.01, -.03, .05, .05, .05);
      part(rig.tail, cylG(.03, .03, .025, 10), uni, 0, -.04, -.05, 1, 1, 1, .4, 0, 0);
      part(rig.tail, GEO.sph, hc, 0, -.14, -.07, .045, .11, .045, .3, 0, 0);
      break;
    case 'short':
      cap(.168, Math.PI * .56, .135, -.32);
      part(h, GEO.sph, hc, .03, .262, .1, .11, .045, .06, 0, 0, .35);
      for (const sd of [1, -1]) part(h, GEO.sph, hc, sd * .142, .17, -.01, .035, .07, .09);
      break;
    case 'bun':
      cap(.164, Math.PI * .5, .14, -.42);
      part(h, GEO.sph, hc, 0, .275, -.1, .07, .065, .07);
      part(h, torG(.05, .012), uniDk, 0, .25, -.085, 1, 1, 1, -.9, 0, 0);
      break;
    case 'curls':
      cap(.162, Math.PI * .5, .14, -.35);
      for (let i = 0; i < 16; i++) {
        const th = .15 + (i % 3) * .42, ph = i * 2.4;
        if (Math.cos(ph) > .55 && th > .5) continue;                       // keep the forehead clear
        part(h, GEO.sph, hc, Math.sin(th) * Math.sin(ph) * .16, .14 + Math.cos(th) * .175, Math.sin(th) * Math.cos(ph) * .16 - .015, .06, .06, .06);
      }
      break;
    case 'buzz':
      cap(.165, Math.PI * .5, .135, -.45, 1.07);
      break;
    case 'long':
      cap(.17, Math.PI * .54, .14, -.34);
      part(h, GEO.sph, hc, 0, .02, -.09, .15, .2, .08);
      for (const sd of [1, -1]) part(h, GEO.sph, hc, sd * .13, .06, -.01, .04, .15, .07);
      part(h, GEO.sph, hc, -.04, .26, .1, .1, .04, .06, 0, 0, -.3);
      break;
  }
  // accessories
  if (has('glasses')) {
    for (const sd of [1, -1]) {
      part(h, torG(.036, .007), '#2b2f33', sd * .056, .145, .16);
      part(h, GEO.box, '#2b2f33', sd * .128, .15, .075, .006, .008, .16, 0, sd * .25, 0);
    }
    part(h, GEO.box, '#2b2f33', 0, .15, .162, .03, .007, .007);
  }
  if (has('beard')) {
    part(h, GEO.sph, hc, 0, .06, .07, .13, .085, .1);
    for (const sd of [1, -1]) part(h, GEO.sph, hc, sd * .13, .1, .03, .03, .07, .05);
  }

  if (has('headband')) part(h, torG(.163, .013), uni, 0, .2, -.01, 1, 1, 1, Math.PI / 2 - .35, 0, 0);

  for (const side of [1, -1]) {
    const sh = pv(rig.chest, side * .205 * bw, .27, 0);
    part(sh, GEO.sph, uni, 0, 0, 0, .062 * bw, .062, .062 * bw);
    part(sh, cylG(.052 * bw, .046 * bw, .23), uni, 0, -.115, 0);
    const el = pv(sh, 0, -.23, 0);
    part(el, GEO.sph, uni, 0, 0, 0, .046 * bw, .046, .046 * bw);
    part(el, cylG(.045 * bw, .04 * bw, .2), uni, 0, -.1, 0);
    part(el, cylG(.044 * bw, .044 * bw, .03, 12), uniDk, 0, -.185, 0);
    const hand = pv(el, 0, -.2, 0);
    part(hand, GEO.sph, skin, 0, -.045, .005, .042 * bw, .052, .036);
    rig.arms.push({ sh, el, hand, side, x: 0, e: -.15 });
  }

  return rig;
}

// two-bone IK in the leg's swing plane: ankle target (ty, tz) relative to the hip joint
function legIK(leg, ty, tz) {
  let d = Math.hypot(ty, tz); const max = LT + LS - .003;
  if (d > max) { ty *= max / d; tz *= max / d; d = max; }
  const base = Math.atan2(-tz, -ty);
  const a = Math.acos(THREE.MathUtils.clamp((LT * LT + d * d - LS * LS) / (2 * LT * d), -1, 1));
  const k = Math.PI - Math.acos(THREE.MathUtils.clamp((LT * LT + LS * LS - d * d) / (2 * LT * LS), -1, 1));
  leg.thigh.rotation.x = base - a; leg.knee.rotation.x = k;
  return base - a + k;
}
const ss = u => u * u * (3 - 2 * u);
const L = (a, b, k) => a + (b - a) * k;
// one gait cycle = two steps. During stance each foot moves back at exactly walking speed, so feet stay planted.
const STRIDE = .46, STANCE = .6, CYCLE = STRIDE / STANCE, LIFT = .12;
function animateRig(rig, g, dt, t, sk, rnd = R) {      // rnd: the crowd passes each person's own stream, so it never draws on R()
  const w = g.w, p = g.p % 1, TAU = Math.PI * 2;
  const hipY = L(HIP_Y + Math.sin(t * 1.7) * .004, HIP_W + .024 * Math.cos(2 * TAU * (p - .3)), w);
  const hipX = L(Math.sin(t * .45) * .012, .026 * Math.cos(TAU * (p - .3)), w);
  rig.hips.position.set(hipX, hipY, 0);
  rig.hips.rotation.z = L(Math.sin(t * .45) * .02, .05 * Math.cos(TAU * (p - .3)), w);
  let zL = 0;
  for (const leg of rig.legs) {
    const q = (p + leg.off) % 1;
    let z, lift = 0, pitch = 0;
    if (q < STANCE) {                                   // planted, rolling heel to toe
      z = STRIDE / 2 - q / STANCE * STRIDE;
      if (q < .08) pitch = L(-.22, 0, q / .08);
      if (q > .42) pitch = ss((q - .42) / .18) * .5;
    } else {                                            // swing: lift, carry forward, reach
      const u = (q - STANCE) / (1 - STANCE);
      z = -STRIDE / 2 + STRIDE * ss(u);
      lift = Math.sin(Math.PI * Math.min(1, u * 1.1)) * LIFT * (1 - .35 * u);
      pitch = u < .35 ? L(.5, 0, u / .35) : L(0, -.22, (u - .35) / .65);
    }
    const ang = legIK(leg, ANK + lift * w - (hipY - HIP_OFF), z * w);
    leg.ankle.rotation.x = -ang + pitch * w;
    leg.thigh.rotation.z = -hipX / hipY - rig.hips.rotation.z + leg.side * .02;
    if (leg.side > 0) zL = z;
  }
  const fl = zL / (STRIDE / 2) * w;
  rig.hips.rotation.y = -.16 * fl;
  rig.chest.rotation.y = .3 * fl;
  g.lean += ((.09 * sk * w) - g.lean) * Math.min(1, dt * 4);
  rig.torso.rotation.x = g.lean;
  rig.chest.rotation.z = -rig.hips.rotation.z * .7;
  rig.chest.scale.y = 1 + Math.sin(t * 1.7) * .012 * (1 - w);
  for (const a of rig.arms) {
    const fwd = a.side > 0 ? -fl : fl;
    const tx = L(Math.sin(t * 1.1 + a.side) * .03, -.62 * fwd * (.6 + .4 * sk), w);
    const te = L(-.18, -.28 - .55 * Math.max(0, fwd), w);
    a.x += (tx - a.x) * Math.min(1, dt * 11); a.e += (te - a.e) * Math.min(1, dt * 9);
    a.sh.rotation.x = a.x; a.el.rotation.x = a.e;
    a.sh.rotation.z = a.side * L(.1 + Math.sin(t * 1.7) * .012, .08, w);
    a.hand.rotation.x = L(-.1, -.25, w);
    if (a.side < 0 && g.reach > 0) {                    // the right hand reaches forward to a panel; a small push at the top
      const k = g.reach, push = Math.max(0, Math.sin((k - .85) / .15 * Math.PI)) * .06;
      a.sh.rotation.x = L(a.sh.rotation.x, -1.32 - push, k); a.el.rotation.x = L(a.el.rotation.x, -.42 + push, k);
      a.sh.rotation.z = L(a.sh.rotation.z, a.side * -.12, k); a.hand.rotation.x = L(a.hand.rotation.x, .35, k);
    }
  }
  g.lookT -= dt;
  if (g.lookT <= 0) { g.look = rnd() < .4 ? 0 : (rnd() - .5) * 1.2; g.lookT = 2 + rnd() * 4; }
  const yaw = L(g.look, 0, w) - rig.chest.rotation.y - rig.hips.rotation.y;
  rig.head.rotation.y += (yaw - rig.head.rotation.y) * Math.min(1, dt * 5);
  rig.head.rotation.x = L(Math.sin(t * .8) * .03, -g.lean * .8 + .025 * Math.cos(2 * TAU * (p - .35)), w);
  if (rig.tail) {
    const force = w * Math.cos(2 * TAU * (p - .3)) * 4 * sk - g.turn * 2.5 + g.lean * 8;
    g.tailV += (force - g.tail * 35 - g.tailV * 5) * dt; g.tail += g.tailV * dt;
    rig.tail.rotation.x = .1 + g.tail * .25; rig.tail.rotation.z = THREE.MathUtils.clamp(g.turn, -2, 2) * -.08;
  }
}

// =====================================================================
// 8b. CROWD
// Everyone who isn't you or a close crew member is drawn here. Each person
// is the figure makeCharacter builds, at lower detail, and a group of up to
// CROWD_PER people shares one skinned mesh: their joints are its bones. So
// 40 crew cost about 8 draw calls (shadows included) instead of about 700.
//   const h = crowd.add(spec)      spec as makeCharacter takes: dept, rank, skin, hair, hairColor, height, build, acc
//   h.set(pos, face, pose, walkPhase)
//     pos   world {x, y, z}. For sit and lie, y is the seat or mattress top (0: a usual chair or bunk).
//     face  an angle like Walker.face (0 looks toward +z). For lie, the way from head to feet.
//     pose  'walk' | 'stand' | 'sit' | 'lie' | 'work'. Changes blend over about half a second.
//     walkPhase  optional, in gait cycles. Leave it out and the gait follows how far pos moves.
//   crowd.remove(h); crowd.clear(); crowd.near(x, z) finds who's there; crowd.update(dt, t) runs once a frame.
// A person further than CROWD_FAR tiles from the camera's target, or everyone when zoomed far out, is

const liftDoors = () => DOOR_OBJS.filter(d => d.e.type === 'lift');
// The panel is on the car's back wall, in front of its east column. Tapping a lift door or the panel walks you
// in and up to it, then opens the deck list. Choosing a deck: you reach out and press, and the ride starts.
const panelTile = () => { const b = ROOM_BOX['@']; return b && [b.i0 + 1, b.j0]; };
function facePanel() { const b = ROOM_BOX['@'], p = player.obj.position; player.face = Math.atan2(X0(b.i0) + 1.5 - p.x, Z0(b.j0) - p.z); }
function toPanel(done) {
  const here = player.here(), pt = panelTile(); if (!pt) return;
  const at = () => { facePanel(); done(); };
  if (K(pt) === K(here) && !player.path.length) { at(); return; }
  if (free(...pt) && !occupiedBy(player).has(K(pt)) && findPath(here, pt, null, player)) { playerGo(pt, at); return; }
  // someone's at the panel: nearest free car tile, and reach from there
  const tiles = (ROOM_TILES['@'] || []).filter(c => K(c) === K(here) || findPath(here, c, null, player));
  if (!tiles.length) return;
  const goal = tiles.sort((a, b) => Math.hypot(a[0] - pt[0], a[1] - pt[1]) - Math.hypot(b[0] - pt[0], b[1] - pt[1]))[0];
  if (K(goal) === K(here) && !player.path.length) at(); else playerGo(goal, at);
}
function enterLift() { if (!ride) toPanel(openLiftPanel); }
function pressPanel(n) {
  toPanel(() => { player.press = { t: 0, fired: false, cb: () => startRide(n) }; });
}
function openLiftPanel() {
  liftReturn = document.activeElement; liftList.textContent = '';
  for (let n = 1; n <= 6; n++) {
    const here = n === deckDef.num, built = !!DECKS[n], b = document.createElement('button');
    b.className = 'deckbtn' + (here ? ' here' : ''); b.disabled = here || !built;
    const i = document.createElement('i'), sp = document.createElement('span'), t = document.createElement('b'), sm = document.createElement('small');
    i.textContent = n; t.textContent = DECK_NAMES[n]; sm.textContent = here ? 'You are here' : built ? DECKS[n].blurb : 'Not built yet';
    sp.append(t, sm); b.append(i, sp);
    b.setAttribute('aria-label', `Deck ${n}, ${DECK_NAMES[n]}: ${sm.textContent}`);
      b.onclick = () => { closeLiftPanel(); pressPanel(n); };
    liftList.appendChild(b);
  }
  liftEl.hidden = false; toastEl.classList.remove('show');
  (liftList.querySelector('button:not(:disabled)') || document.getElementById('liftStay')).focus();
}
function closeLiftPanel() { liftEl.hidden = true; if (liftReturn && liftReturn.focus) liftReturn.focus(); }
document.getElementById('liftStay').onclick = closeLiftPanel;
addEventListener('keydown', e => { if (e.key === 'Escape' && !liftEl.hidden) closeLiftPanel(); });
function startRide(n) {
  if (!inLift()) return;
  endSteer(); player.stop(); toastEl.classList.remove('show');
  ride = { n, t: 0, at: player.obj.position.clone(), face: player.face, swapped: false };
}
// seconds along a ride: the doors close, the view fades, the new deck is built behind the black, it fades back, the doors open
const RIDE = { shut: .55, dark: .95, light: 1.35, done: 1.8 };
function updateRide(dt) {
  const r = ride; r.t += dt; const T_ = r.t;
  for (const d of liftDoors()) d.force = T_ >= RIDE.light && r.swapped ? 1 : 0;
  if (!r.swapped) {
    fadeEl.style.opacity = THREE.MathUtils.clamp((T_ - RIDE.shut) / (RIDE.dark - RIDE.shut), 0, 1);
    if (T_ >= RIDE.dark) {
      goToDeck(r.n, r.at); player.face = player.obj.rotation.y = r.face;
      for (const d of liftDoors()) { d.open = 0; d.force = 0; }
      r.swapped = true;
    }
  } else {
    fadeEl.style.opacity = THREE.MathUtils.clamp(1 - (T_ - RIDE.dark) / (RIDE.light - RIDE.dark), 0, 1);
    if (T_ >= RIDE.done) {
      for (const d of liftDoors()) delete d.force;      // back to opening for whoever's near
      fadeEl.style.opacity = 0; ride = null;
      toast('Deck ' + deckDef.num + ', ' + deckDef.name, deckDef.arrive || '');
    }
  }
}

// =====================================================================
// 12. MAIN LOOP
// =====================================================================
const clock = new THREE.Clock(); let scrT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  updateSteer();
  for (const w of walkers) if (w.active) w.update(dt, t);
  updateDeckCrew(dt);                                    // section 10: the scheduled crew
  crowd.update(dt, t);

  // camera follows you
  az += (azT - az) * Math.min(1, dt * 6);
  const pp = player.obj.position;
  target.x += (pp.x - target.x) * Math.min(1, dt * 3); target.z += (pp.z - target.z) * Math.min(1, dt * 3);
  placeCam(); placeSun(target);

  // cutaway: wall runs between the camera and you drop to knee height, a whole run at a time
  const cx = Math.sin(az), cz = Math.cos(az), k7 = Math.min(1, dt * 7);
  // a run drops if any part of it stands in front of you and near your line of sight
  const rx = Math.cos(az), rz = -Math.sin(az);
  const hides = e => (e.cx - pp.x) * cx + (e.cz - pp.z) * cz > .25 && Math.abs((e.cx - pp.x) * rx + (e.cz - pp.z) * rz) < 3.5;
  // the hull: pieces facing the camera (lower and right on screen) stay low, the far ones (upper and left) stay up
  for (const r of RUNS) r.cut = r.face ? r.face[0] * cx + r.face[1] * cz > 0
    : wallsMode === 'up' ? false : wallsLow || (r.out && r.out[0] * cx + r.out[1] * cz > .3) || r.edges.some(hides);
  for (const e of edgeList) e.s += ((e.run.cut ? .12 : 1) - e.s) * k7;
  for (const c of CURVES) if (c.run) { c.s += ((c.run.cut ? .12 : 1) - c.s) * k7; c.g.scale.y = c.s; }
  for (const p of POSTS) p.s = Math.max(...p.touch.map(e => e.s));
  writeWalls();
  for (const hr of HULL_RUNS) { hr.s += ((hr.cut ? .12 : 1) - hr.s) * k7; hr.g.scale.y = hr.s; hr.decor.visible = hr.s > .9; }
  for (const e of EDGES.values()) if (e.hrun) e.s = e.hrun.s;
  for (const d of DOOR_OBJS) d.g.scale.y = d.e.s;
  for (const t of TALL) {                              // tall furniture fades when it would hide you
    const hides = t.pts.some(p => { const dep = (p.x - pp.x) * cx + (p.z - pp.z) * cz; return dep > .3 && dep < 4.5 && Math.abs((p.x - pp.x) * rx + (p.z - pp.z) * rz) < .5 + p.w / 2; });
    const goal = !wallsLow && hides ? .22 : 1;
    if (Math.abs(t.o - goal) < .002) continue;
    t.o += (goal - t.o) * k7; if (Math.abs(t.o - goal) < .01) t.o = goal;
    const fade = t.o < .99;
    for (const m of t.mats) {
      m.opacity = m.userData.base.op * t.o; m.depthWrite = !fade;
      const tr = fade || m.userData.base.tr; if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
    }
  }
  for (const d of WALL_DECOR) d.g.visible = d.e ? d.e.s > .9 : true;
  for (const v of VOID_BLOCKS) {
    const b = v.m.geometry.boundingBox || (v.m.geometry.computeBoundingBox(), v.m.geometry.boundingBox);
    const near = Math.max(...[[b.min.x, b.min.z], [b.max.x, b.min.z], [b.min.x, b.max.z], [b.max.x, b.max.z]].map(([x, z]) => (v.cx + x - pp.x) * cx + (v.cz + z - pp.z) * cz));
    v.s += ((wallsLow || (wallsMode === 'auto' && near > .25) ? .12 : 1) - v.s) * k7; v.m.scale.y = v.s;
  }

  if (ride) updateRide(dt);
  // doors slide open for anyone nearby (lift doors only when a ride opens them, and they drop into the floor)
  for (const d of DOOR_OBJS) {
    const crewAt = d.force === undefined && crewNearDoor(d);   // section 10: crew open doors (and their own locked ones)
    if (!d.passable && !d.svc && d.force === undefined && d.open < 1e-4 && !crewAt) continue;
    const near = d.force !== undefined ? d.force > 0 : crewAt || (d.passable || d.svc) && walkers.some(w => w.active && Math.hypot(w.obj.position.x - d.cx, w.obj.position.z - d.cz) < 1.15 + (d.span - SEG) / 2);
    d.open += ((near ? 1 : 0) - d.open) * Math.min(1, dt * (d.force !== undefined ? 5 : d.svc ? 4 : 8));   // a service hatch is heavier
    if (d.e.type === 'lift') d.leaves.forEach(l => { l.position.y = 1.1 - d.open * 2.3; l.visible = d.open < .995; });   // lift doors sink into the floor
    else d.leaves.forEach((l, k) => { l.position.x = (k ? 1 : -1) * (d.span / 4 + d.open * d.span / 2 * .92); });
  }

  nightT += (nightAt() - nightT) * Math.min(1, dt * 1.8); applyLight(nightT);

  // ambient life
  // stars outside: the sky drifts aft across the screen, with a touch of parallax as the camera follows you.
  // Windows are open to it, so the stars you see through them are the same ones.
  {
    const ax = -_r.x, ay = -_u.x, l = Math.hypot(ax, ay) || 1, wpp = (camera.top - camera.bottom) / camera.zoom / innerHeight;
    const v = dt * SKY.speed / l, px = target.dot(_r) / wpp, py = target.dot(_u) / wpp, U = SKY.mat.uniforms;
    SKY.far.x = (SKY.far.x - ax * v * 7) % 512; SKY.far.y = (SKY.far.y - ay * v * 7) % 512;
    SKY.near.x = (SKY.near.x - ax * v * 18) % 512; SKY.near.y = (SKY.near.y - ay * v * 18) % 512;
    U.uFar.value.set(SKY.far.x + px * .03, SKY.far.y + py * .03); U.uNear.value.set(SKY.near.x + px * .08, SKY.near.y + py * .08);
    U.uPR.value = renderer.getPixelRatio();
  }
  for (const D_ of DUST) {
    const a = D_.geo.attributes.position.array;
    for (let i = 0; i < D_.n; i++) { a[i * 3 + 1] += Math.sin(t * .3 + D_.seeds[i]) * .0015; a[i * 3] += Math.cos(t * .2 + D_.seeds[i]) * .001; }
    D_.geo.attributes.position.needsUpdate = true;
  }
  for (const sp of SPINS) sp.o.rotation[sp.ax] += sp.w * dt;
  for (const p of PULSES) p.m[p.key] = p.base + p.amp * (.5 + .5 * Math.sin(t * p.w + p.ph));
  for (const s of STEAM) { const k = (t * .35 + s.i / 3) % 1; s.s.position.y = s.y + k * .45; s.s.position.x = s.x + Math.sin(t + s.i * 2) * .03; s.s.material.opacity = Math.sin(k * Math.PI) * .22; s.s.scale.setScalar(.1 + k * .18); }
  marker.material.opacity *= 1 - dt * 2.2; marker.scale.setScalar(1 + (1 - marker.material.opacity) * .3);
  scrT += dt; if (scrT > .1) { scrT = 0; drawScreen(t); }
  tickShip(dt);                                          // section 13: the ship's clock
  const r = roomAt(...player.here()); if (r && r !== lastRoom) { lastRoom = r; roomEl.textContent = ROOMS[r].name; }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
drawScreen(0); applyLight(0); loop();
})();
</script>
