# The quick check on GitHub: runs check_fast.sh (the same as every helper runs before a push) and shows a tick or a cross.
# SWITCHED OFF for now (the user's rule, 2026-10-20): it only runs when started by hand from the Actions tab
# (workflow_dispatch). GitHub emails the repository's owner on every failed run, so the user settles that email setting
# first; then the lead switches it on by replacing the `on:` block below with ONE of the two commented ones:
#   A. every push to the shared branch only (fewest emails; the build master reads the result before merging on), or
#   B. every push to any claude/ branch (helpers see their own result; one email per red push).
# Before pushing a change to this file, check it reads as YAML (a broken file shows only a red cross, no log):
#   python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" .github/workflows/quick-check.yml
# Ported from the split rehearsal's tested workflow (claude/split-rehearsal, runs 2-6: green ~5 min, red in ~30 s).
name: quick check
on:
  workflow_dispatch:
# A. (switch on: delete the three lines above from "on:" and remove the "# " in front of these)
# on:
#   push:
#     branches: [claude/integration]
# B.
# on:
#   push:
#     branches: ['claude/**']
#     paths: ['starship-cadet.html', 'names_check.js', 'check_fast.sh', 'cadet_test.py', '*_check.py',
#             'content_gen.py', 'content/**', '.github/**']
concurrency:
  group: quick-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/quick-check.yml }
      - name: python packages
        run: pip install playwright numpy pillow
      - name: browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
      - name: browser
        run: python -m playwright install --with-deps chromium
      - name: three.js r128 and acorn
        run: |
          mkdir -p "$RUNNER_TEMP/cw/three" "$RUNNER_TEMP/cw/acorn"
          cd "$RUNNER_TEMP/cw/three" && npm pack -q three@0.128.0 && tar xzf three-0.128.0.tgz
          cd "$RUNNER_TEMP/cw/acorn" && npm pack -q acorn@8.12.1 && tar xzf acorn-8.12.1.tgz
      - name: quick check
        env:
          CADET_CHROME: ''
          CADET_WORK: ${{ runner.temp }}/cw
        run: bash check_fast.sh
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: ${{ runner.temp }}/cw/check-fast
          if-no-files-found: ignore
