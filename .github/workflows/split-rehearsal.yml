# The split rehearsal's GitHub check (SX1): the quick check on every push to claude/split-rehearsal ONLY.
# A throwaway branch's test of the plan's "GitHub runs the quick check on every push"; never merged.
name: quick check (split rehearsal)
on:
  push:
    branches: [claude/split-rehearsal]
    paths: ['pieces/**', 'starship-cadet.html', 'build.py', 'split.py', 'names_check.js', 'check_fast.sh', 'cadet_test.py',
            '*_check.py', 'content_gen.py', 'content/**', 'plans/trad_parse.py', 'plans/crew-roster-gen.py', '.github/**']
concurrency:
  group: quick-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: .github/workflows/split-rehearsal.yml }
      - name: python packages
        run: pip install playwright numpy pillow
      - name: browser cache
        uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-${{ runner.os }}-v1 }
      - name: browser
        run: python -m playwright install --with-deps chromium
      - name: three.js r128 and acorn
        run: |
          mkdir -p "$RUNNER_TEMP/cw/three" "$RUNNER_TEMP/cw/acorn"
          cd "$RUNNER_TEMP/cw/three" && npm pack -q three@0.128.0 && tar xzf three-0.128.0.tgz
          cd "$RUNNER_TEMP/cw/acorn" && npm pack -q acorn@8.12.1 && tar xzf acorn-8.12.1.tgz
      - name: quick check
        env: { CADET_CHROME: '', CADET_WORK: '${{ runner.temp }}/cw' }
        run: bash check_fast.sh
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: check-logs, path: '${{ runner.temp }}/cw/check-fast', if-no-files-found: ignore }
